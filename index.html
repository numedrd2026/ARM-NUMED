const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const shiftDay=(n,base=today())=>{const d=new Date(base+'T12:00:00');d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const startAt=(day,time)=>`${day}T${time}:00-04:00`;
const formatDate=(d,options={day:'2-digit',month:'short',year:'numeric'})=>{try{return new Intl.DateTimeFormat('es-DO',{timeZone:'America/Santo_Domingo',...options}).format((typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d))?new Date(d+'T12:00:00-04:00'):new Date(d))}catch{return d||'-'}};

   assertRole(isOps());const patientId=payload.patientId,doctorId=payload.doctorId;
   const start=startAt(payload.day,payload.time),end=new Date(new Date(start).getTime()+45*60000).toISOString();
   if(!patientId||!doctorId||!doctorUsers().some(d=>d.id===doctorId))throw new Error('Selecciona paciente y doctora validos.');
   if(conflict(doctorId,start,end,action==='appointment.reschedule'?payload.id:null))throw new Error('La doctora ya tiene una cita en ese horario. Selecciona otro.');
   if(action==='appointment.create'){
    if(LIVE)await dbWrite('arm_appointments','insert',{patient_id:patientId,doctor_id:doctorId,starts_at:start,ends_at:end,type:payload.type,status:'scheduled'},null);
    else{const a={id:uuid(),patientId,doctorId,start,end,type:payload.type,status:'scheduled',createdBy:ui.actorId};model.appointments.push(a);record('appointment.created','arm_appointments',a.id,null,{patientId,doctorId,start},'Nueva cita');}
    msg='Cita agendada. Pendiente de confirmar.';
   }else{
    const a=model.appointments.find(x=>x.id===payload.id);if(!a)throw new Error('Cita no encontrada.');
    if(LIVE)await dbWrite('arm_appointments','update',{doctor_id:doctorId,starts_at:start,ends_at:end,status:'rescheduled'},a.id);
    else {const old={start:a.start,doctorId:a.doctorId,status:a.status};Object.assign(a,{start,end,doctorId,status:'rescheduled'});record('appointment.rescheduled','arm_appointments',a.id,old,{start,doctorId,status:a.status});}
    msg='Cita reprogramada.';
   }
  }
  else if(action==='appointment.status'){
   assertRole(isOps());const a=model.appointments.find(x=>x.id===payload.id);if(!a)throw new Error('Cita no encontrada.');
   const allowed={scheduled:['confirmed','arrived','no_show','cancelled'],confirmed:['arrived','no_show','cancelled'],arrived:['in_service','completed'],in_service:['completed'],rescheduled:['confirmed','arrived','no_show','cancelled'],completed:[],no_show:[],cancelled:[]};
   if(!allowed[a.status]?.includes(payload.status))throw new Error('La transicion de estado solicitada no esta permitida.');
   if(LIVE)await dbWrite('arm_appointments','update',{status:payload.status},a.id);
   else{const old={status:a.status};a.status=payload.status;record(`appointment.${payload.status}`,'arm_appointments',a.id,old,{status:a.status},patientName(a.patientId));}
   msg='Estado de la cita actualizado.';
  }
  else if(action==='followup.create'){
   assertRole(isOps());if(!findPatient(payload.patientId))throw new Error('Paciente invalido.');
   if(LIVE)await dbWrite('arm_followups','insert',{patient_id:payload.patientId,title:payload.title,details:payload.detail||null,due_at:payload.dueAt,assigned_to:payload.assignedTo,priority:payload.priority,status:'pending',category:payload.category},null);
   else {const t={...payload,id:uuid(),status:'pending',createdBy:ui.actorId};model.followups.unshift(t);record('followup.created','arm_followups',t.id,null,{title:t.title,assignedTo:t.assignedTo},'Seguimiento creado');}
   msg='Seguimiento registrado.';
  }
  else if(action==='followup.status'){
   assertRole(isOps());const t=model.followups.find(x=>x.id===payload.id);if(!t)throw new Error('Seguimiento no encontrado.');
   if(!['pending','progress','completed'].includes(payload.status))throw new Error('Estado invalido.');
   if(LIVE)await dbWrite('arm_followups','update',{status:payload.status,completed_at:payload.status==='completed'?new Date().toISOString():null,completed_by:payload.status==='completed'?ui.actorId:null},t.id);
   else{const old={status:t.status};t.status=payload.status;if(payload.status==='completed'){t.completedBy=ui.actorId;t.completedAt=new Date().toISOString()}record(payload.status==='completed'?'followup.completed':'followup.updated','arm_followups',t.id,old,{status:t.status},t.title);}
   msg='Seguimiento actualizado.';
  }
  else if(action==='support.create'){
   assertRole(isAdmin());if(LIVE)await dbWrite('arm_support_cases','insert',{staff_id:payload.staffId,category:payload.category,details:payload.details,status:'open'},null);
   else{const s={...payload,id:uuid(),status:'open',createdAt:new Date().toISOString(),createdBy:ui.actorId};model.support.unshift(s);record('support.created','arm_support_cases',s.id,null,{category:s.category,staffId:s.staffId},'Acompanamiento creado');}
   msg='Plan de apoyo registrado.';
  }
  else if(action==='message.create'){
   assertRole(isOps());if(LIVE)await dbWrite('arm_messages','insert',{patient_id:payload.patientId,channel:'WhatsApp',content:payload.content,status:'draft'},null);
   else {const m={...payload,id:uuid(),channel:'WhatsApp',status:'draft',createdAt:new Date().toISOString(),createdBy:ui.actorId};model.messages.unshift(m);record('message.created','arm_messages',m.id,null,{status:'draft'},'Borrador');}
   msg='Mensaje guardado como borrador. No se ha enviado.';
  }
  else if(action==='message.sent'){
   assertRole(isOps());const m=model.messages.find(x=>x.id===payload.id);if(!m)throw new Error('Mensaje no encontrado.');
   if(LIVE)await dbWrite('arm_messages','update',{status:'sent'},m.id);
   else {m.status='sent';record('message.updated','arm_messages',m.id,{status:'draft'},{status:'sent'});}
   msg='Marcado como enviado manualmente.';
  }
  else throw new Error('Operacion desconocida.');
  if(LIVE)await loadLive();else persistDemo();
  ui.modal=null;render();toast(msg);
 }catch(e){toast(e.message||'No se pudo guardar.');console.warn('ARM operation:',e.message)}finally{ui.loading=false}
}

function appointmentActions(a,compact=false){if(!isOps()||LIVE)return '';const actions=[];
 if(['scheduled','rescheduled'].includes(a.status))actions.push(`<button class="btn small primary" data-appt-status="confirmed" data-id="${safe(a.id)}">Confirmar</button>`);
 if(['scheduled','confirmed','rescheduled'].includes(a.status))actions.push(`<button class="btn small" data-appt-status="arrived" data-id="${safe(a.id)}">Llegada</button>`);
 if(a.status==='arrived')actions.push(`<button class="btn small primary" data-appt-status="in_service" data-id="${safe(a.id)}">En atencion</button>`);
 if(['arrived','in_service'].includes(a.status))actions.push(`<button class="btn small green" data-appt-status="completed" data-id="${safe(a.id)}">Atendida</button>`);
 if(['scheduled','confirmed','rescheduled'].includes(a.status))actions.push(`<button class="btn small" data-edit-appt="${safe(a.id)}">Reprogramar</button>`);
 if(['scheduled','confirmed','rescheduled'].includes(a.status))actions.push(`<button class="btn small ghost" data-appt-status="no_show" data-id="${safe(a.id)}">No asistio</button>`);
 if(['scheduled','confirmed','rescheduled'].includes(a.status)&&!compact)actions.push(`<button class="btn small danger" data-appt-status="cancelled" data-id="${safe(a.id)}">Cancelar</button>`);
 return actions.join('');}

function pageCommunications(){if(!isOps())return '<div class="notice">No tienes acceso al centro de comunicaciones.</div>';const msgs=[...model.messages].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));return `${pageHead('Centro de comunicaciones','Plantillas y mensajes administrativos. Sin envios automaticos habilitados.',`<button class="btn primary" data-modal="message">${icon('plus',16)} Preparar mensaje</button>`)}<div class="notice warning" style="margin-bottom:16px"><strong>Importante:</strong> los mensajes se crean como borradores. No se enviaran por WhatsApp ni correo hasta que se configure una integracion autorizada. Antes de contactar, verifica el consentimiento del paciente.</div><div class="grid-main"><div class="card card-pad"><div class="card-title"><h2>Mensajes preparados</h2><span class="subtle">${msgs.length} registros</span></div>${msgs.length?msgs.map(m=>`<div class="task-card"><div class="row" style="justify-content:space-between"><strong style="color:var(--navy)">${safe(patientName(m.patientId))}</strong>${badge(m.status)}</div><p style="font-size:11px;line-height:1.9;margin:9px 0;color:#597588">${safe(m.content)}</p><div class="task-foot"><small class="subtle">${safe(m.channel)} &middot; ${safe(actorName(m.createdBy))} &middot; ${safe(formatDate(m.createdAt))}</small><div class="inline-actions"><button class="btn small" data-copy-message="${safe(m.id)}">Copiar</button>${m.status==='draft'?`<button class="btn small ghost" data-mark-sent="${safe(m.id)}">Marcar envio manual</button>`:''}</div></div></div>`).join(''):'<div class="blank">Aun no hay borradores.</div>'}</div><div class="card card-pad"><div class="card-title"><h2>Plantillas sugeridas</h2></div>${[['confirmation','Confirmacion de cita','Un mensaje cordial para confirmar asistencia.'],['reminder','Recordatorio de cita','Recordatorio breve con fecha de consulta.'],['recovery','Reprogramacion','Ofrecer una fecha alternativa sin presion.']].map(([k,n,d])=>`<div class="list-item"><div><div class="lead">${n}</div><div class="desc">${d}</div></div><button class="btn small" data-template="${k}">Utilizar</button></div>`).join('')}</div></div>`;}

function pageInsights(){const ap=visibleAppointments();const totals={confirmed:ap.filter(x=>x.status==='confirmed').length,arrived:ap.filter(x=>x.status==='arrived'||x.status==='in_service').length,completed:ap.filter(x=>x.status==='completed').length,no_show:ap.filter(x=>x.status==='no_show').length};const vals=Array.from({length:7},(_,i)=>({day:shiftDay(i-6),count:ap.filter(x=>ymd(x.start)===shiftDay(i-6)).length}));const max=Math.max(1,...vals.map(x=>x.count));const denom=Math.max(1,ap.filter(a=>!['cancelled','rescheduled'].includes(a.status)).length);return `${pageHead('Indicadores operativos','Estadisticas de citas y tareas. No incluye facturacion ni datos clinicos.') }<div class="cards4">${metric(ap.length,'Citas registradas','En la vista autorizada','calendar')}${metric(totals.confirmed,'Confirmadas','Con estado confirmado','check')}${metric(totals.no_show,'Inasistencias','No son fallas del personal','alert')}${metric(`${Math.round(totals.confirmed/denom*100)}%`,'Confirmacion','Porcentaje orientativo','chart')}</div><div class="grid-main equal"><div class="card card-pad"><div class="card-title"><h2>Actividad de la ultima semana</h2><span class="subtle">Numero de citas por fecha</span></div><div class="bars">${vals.map(v=>`<div class="bar-col"><span style="height:${Math.max(5,v.count/max*92)}%" title="${v.count} citas"></span><label>${safe(formatDate(v.day+'T12:00:00',{weekday:'short'}))}</label></div>`).join('')}</div><p class="subtle" style="margin-top:15px">Datos de la agenda visible para tu usuario; no reflejan un volumen completo si hay filtros de permisos.</p></div><div class="card card-pad"><div class="card-title"><h2>Distribucion de estados</h2></div>${[['Por confirmar',ap.filter(x=>x.status==='scheduled'||x.status==='rescheduled').length],['Confirmadas',totals.confirmed],['En sala',totals.arrived],['Atendidas',totals.completed],['No asistio',totals.no_show]].map(([k,v])=>`<div class="list-item" style="align-items:flex-start"><div style="flex:1"><div class="row" style="justify-content:space-between"><strong>${k}</strong><strong>${v}</strong></div><div class="progress"><span style="width:${Math.round(v/Math.max(1,ap.length)*100)}%"></span></div></div></div>`).join('')}</div></div>`;}
function periodMatch(value){const x=new Date(value),cur=new Date();if(Number.isNaN(x.getTime()))return false;const days=ui.period==='week'?7:ui.period==='month'?30:365;return x.getTime()>=cur.getTime()-days*86400000}
function staffStats(id){const events=model.audit.filter(e=>e.actorId===id&&periodMatch(e.occurredAt));const t=model.followups.filter(f=>f.assignedTo===id);return {events:events.length,booked:events.filter(e=>e.eventType==='appointment.created').length,confirmed:events.filter(e=>e.eventType==='appointment.confirmed').length,assigned:t.length,completed:t.filter(x=>x.status==='completed').length,pending:t.filter(x=>x.status!=='completed').length}}
function pageTeam(){if(!isAdmin())return '';const rec=receptionUsers(),staff=rec.map(s=>({...s,stats:staffStats(s.id)}));const totals=staff.reduce((a,s)=>({events:a.events+s.stats.events,assigned:a.assigned+s.stats.assigned,completed:a.completed+s.stats.completed,pending:a.pending+s.stats.pending}),{events:0,assigned:0,completed:0,pending:0});return `${pageHead('Desempeno del personal','Panel privado para Administracion. Metricas orientadas a acompanamiento, no a sanciones.',`<button class="btn primary" data-modal="support">${icon('plus',16)} Registrar acompanamiento</button>`)}<div class="notice" style="margin-bottom:16px"><strong>Interpretacion responsable:</strong> la cantidad de eventos no equivale a calidad. Considera turnos reales, carga asignada, complejidad, interrupciones tecnicas y cancelaciones ajenas al colaborador. Las horas indicadas son de ejemplo o nominales, no registros de asistencia.</div><div class="cards4">${metric(totals.events,'Acciones registradas','Periodo seleccionado','audit')}${metric(totals.assigned,'Seguimientos asignados','Carga actual','tasks')}${metric(totals.completed,'Completados','Cierre de tareas','check')}${metric(totals.pending,'Abiertos','Revisar distribucion','clock')}</div><section class="card card-pad section-gap"><div class="card-title"><div><h2>Actividad por colaboradora</h2><p>Solo disponible para Administracion / Superadministracion</p></div><select class="select" id="team-period"><option value="week" ${ui.period==='week'?'selected':''}>Ultimos 7 dias</option><option value="month" ${ui.period==='month'?'selected':''}>Ultimos 30 dias</option><option value="year" ${ui.period==='year'?'selected':''}>Ultimos 365 dias</option></select></div><div class="staff-row head"><div>Colaboradora</div><div>Eventos</div><div>Agendadas</div><div>Confirmadas</div><div class="extra-col">Tareas cerradas</div><div>Seguimiento</div></div>${staff.map(s=>`<div class="staff-row"><div class="namecell">${tinyActor(s.id)}<span><strong>${safe(s.name)}</strong><small class="subtle">${safe(s.hours||'-')} h/semana nominales</small></span></div><div><strong>${s.stats.events}</strong></div><div><strong>${s.stats.booked}</strong></div><div><strong>${s.stats.confirmed}</strong></div><div class="extra-col"><strong>${s.stats.completed} / ${s.stats.assigned}</strong></div><div class="row" style="flex-wrap:wrap"><span class="badge ${s.stats.pending>=3?'medium':'normal'}">${s.stats.pending} abiertas</span><button class="text-btn" data-staff-audit="${safe(s.id)}">Historial &rarr;</button></div></div>`).join('')}</section><div class="grid-main equal"><section class="card card-pad"><div class="card-title"><h2>Planes de acompanamiento</h2><span class="subtle">${model.support.length} casos</span></div>${model.support.length?model.support.map(s=>`<div class="support-card"><strong>${safe(actorName(s.staffId))} &middot; ${safe(s.category)}</strong><p>${safe(s.details)}</p><small class="subtle">${safe(formatDate(s.createdAt))} &middot; Registrado por ${safe(actorName(s.createdBy))}</small></div>`).join(''):'<div class="blank">No hay planes de apoyo registrados.</div>'}</section><section class="card card-pad"><div class="card-title"><h2>Como interpretar los indicadores</h2></div>${[['01','Comparar tareas y turnos equivalentes, no solo volumen.'],['02','Revisar ausencias y fallas externas antes de atribuir errores.'],['03','Usar los resultados para ofrecer capacitacion y ayuda.'],['04','Restringir historiales individuales al personal autorizado.']].map(([n,t])=>`<div class="list-item"><strong style="color:var(--limeDark)">${n}</strong><span class="subtle" style="flex:1">${t}</span></div>`).join('')}</section></div>`;}

 if(m.kind==='audit.detail'){

function handleAI(query){const q=simple(query).trim();let reply='Puedo ayudarte con citas, confirmaciones, pacientes y seguimientos. Prueba: "citas de manana" o "seguimientos pendientes".';
 const tomorrow=shiftDay(1);const apps=visibleAppointments();const pending=apps.filter(x=>['scheduled','rescheduled'].includes(x.status));const tasks=visibleFollowups().filter(x=>x.status!=='completed');
 if((q.includes('manana')||q.includes('tomorrow'))&&(q.includes('cita')||q.includes('agenda'))){const a=apps.filter(x=>ymd(x.start)===tomorrow);reply=`Para manana hay ${a.length} cita(s) visibles: `+(a.length?a.map(x=>`${formatTime(x.start)} - ${patientName(x.patientId)} con ${actorName(x.doctorId)} (${statusName[x.status]})`).join('; '):'ninguna cita registrada.');}
 else if(q.includes('confirm'))reply=`Hay ${pending.length} cita(s) pendientes de confirmacion en los registros visibles. Puedes abrir Agenda medica y filtrarlas.`;
 else if(q.includes('seguim')||q.includes('tarea'))reply=`Hay ${tasks.length} seguimientos abiertos. De ellos, ${tasks.filter(t=>t.status==='pending').length} estan pendientes y ${tasks.filter(t=>t.status==='progress').length} en proceso.`;
 else if(q.includes('pacient'))reply=`Tienes ${visiblePatients().length} pacientes disponibles segun tu rol. Abre el directorio para buscar por nombre o telefono.`;
 else if(q.includes('desempen')||q.includes('personal')||q.includes('audit'))reply=isAdmin()?'Puedes consultar el panel privado Desempeno del personal y el Registro de actividades desde Control administrativo.':'Las metricas individuales y la auditoria estan reservadas a Administracion y Superadministracion.';
 else if(q.includes('cita')||q.includes('agenda'))reply=`Hay ${apps.length} citas disponibles en tu vista actual, de las cuales ${pending.length} esperan confirmacion.`;
 ui.chat.push({who:'user',text:query},{who:'bot',text:reply});render();const msgs=document.querySelector('#ai-messages');if(msgs)msgs.scrollTop=msgs.scrollHeight;const fm=document.querySelector('#float-messages');if(fm)fm.scrollTop=fm.scrollHeight;
}
function exportAudit(){if(!isAdmin()){toast('Sin permiso para exportar.');return}const rows=filteredAudit();if(!LIVE)record('audit.exported','arm_audit_events','export',null,{count:rows.length});const csvSafe=v=>{let s=String(v??'');if(/^[\s]*[=+@-]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"'};const data=[['Fecha','Responsable','Evento','Tabla','ID'],...rows.map(e=>[e.occurredAt,actorName(e.actorId),auditName[e.eventType]||e.eventType,e.tableName,e.recordId])];const blob=new Blob(['\uFEFF'+data.map(row=>row.map(csvSafe).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`NUMED_ARM_Auditoria_${today()}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('CSV exportado. Protege este archivo: contiene informacion administrativa.');}
